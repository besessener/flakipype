name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Gitleaks (checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz
      - name: Scan entire history for secrets
        run: gitleaks git --redact --verbose --no-banner .
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        env:
          # gitleaks runs over the whole history above; the hook itself only checks staged changes
          SKIP: gitleaks
          GH_TOKEN: ${{ github.token }}

  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported version and the newest stable one.
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.24'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - name: Quality gates (format, lint, types, architecture, dependencies, dead code, tests)
        run: uv run poe check
      - name: Coverage in the job summary
        if: ${{ !cancelled() && matrix.python == '3.12' }}
        run: |
          {
            echo "## Test coverage"
            echo
            uv run coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: smoke (${{ matrix.distribution }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: Ubuntu 24.04
            image: ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
          - distribution: Debian 12
            image: debian:12@sha256:2c037a04925515fdd6ea85ea14a682d0e79931f5e9f5d07b6dbfc6ba12f9e858
          - distribution: Fedora
            image: fedora:latest@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
          - distribution: Arch Linux
            image: archlinux:latest@sha256:4e77cf2ea5f410e6f8be5abf93ccf17ce2436e87a138c167208356711a405dbd
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install what install.sh and the test need
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl git systemd
          elif command -v dnf >/dev/null; then
            dnf install -y curl git systemd tar
          else
            pacman -Syu --noconfirm curl git systemd
          fi
          useradd --create-home smoke
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install with install.sh and start flakipype as a user
        run: |
          cp -r "$GITHUB_WORKSPACE" /home/smoke/flakipype
          chown -R smoke /home/smoke/flakipype
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          su smoke --shell /bin/sh --command "sh /home/smoke/flakipype/tests/smoke/smoke.sh /home/smoke/flakipype $version"
