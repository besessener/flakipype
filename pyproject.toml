[project]
name = "flakipype"
version = "0.2.2"
description = "Agentic CLI that finds, explains and fixes flaky GitHub Actions pipelines."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matthias Eggert" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = [
    "anthropic>=1.12.1",
    "httpx2>=2.13.1",
    "keyring>=25.7.0",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "tomli-w>=1.2.0",
    "typer>=0.27.3",
]

[project.scripts]
flakipype = "flakipype.cli:app"

[project.urls]
Repository = "https://github.com/besessener/flakipype"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "import-linter>=2.15",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-textual-snapshot>=1.0.0",
    "ruff>=0.16.10",
    "shellcheck-py>=0.11.0.1",
    "ty>=0.0.86",
    "types-pyyaml>=6.0.12.20260906",
    "vulture>=2.16",
]

[tool.uv]
default-groups = ["dev"]

# --- Ruff -------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",      # docstrings: names carry intent; comments only for non-obvious constraints
  "ANN401", # explicit Any is allowed at untyped boundaries (JSON, **kwargs)
  "COM812", # conflicts with the formatter
  "ISC001", # conflicts with the formatter
  "CPY",    # no copyright header per file
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",    # assert is how pytest works
  "PLR2004", # literal values are the point of a test
  "INP001",  # tests are not a package
  "PLR0913", # parametrised tests take one parameter per column
  "PLR0917", # same
  "EM101",   # test doubles raise exceptions with inline messages
  "TRY003",  # same
]

[tool.ruff.lint.extend-per-file-ignores]
# Terminal output uses typographic characters on purpose: – › × ↻ ≡ █.
"src/flakipype/cli/*.py" = ["RUF001"]
"src/flakipype/tui/*.py" = ["RUF001"]
"src/flakipype/investigate/chat*.py" = ["RUF001"]
"src/flakipype/fix/service.py" = ["RUF001"]
"tests/unit/fix/*.py" = ["RUF001"]
"tests/unit/cli/*.py" = ["RUF001"]
"tests/unit/investigate/*.py" = ["RUF001"]
"tests/unit/unattended/*.py" = ["RUF001"]
"tests/tui/test_chat*.py" = ["RUF001"]
# The composition root builds the real clock for everything else.
"src/flakipype/cli/wiring.py" = ["TID251"]

[tool.ruff.lint.isort]
known-local-folder = ["support"]

# Only the composition root reads the wall clock; everything else gets `now` as a parameter.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Take `now` as a parameter; only cli/wiring.py reads the clock."
"datetime.datetime.utcnow".msg = "Take `now` as a parameter; only cli/wiring.py reads the clock."
"datetime.datetime.today".msg = "Take `now` as a parameter; only cli/wiring.py reads the clock."
"datetime.date.today".msg = "Take `now` as a parameter; only cli/wiring.py reads the clock."
"time.time".msg = "Take `now` as a parameter; only cli/wiring.py reads the clock."
"time.time_ns".msg = "Take `now` as a parameter; only cli/wiring.py reads the clock."

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 4
max-positional-args = 3

# --- ty ---------------------------------------------------------------------

[tool.ty.environment]
python-version = "3.12"
root = ["src", "tests"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.analysis]
# Suppressions must name a ty rule: `# ty: ignore[<rule>]`.
respect-type-ignore-comments = false

[tool.ty.rules]
# Opt-in rules on top of the defaults; warnings already fail the run.
blanket-ignore-comment = "error"
division-by-zero = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-missing-submodule = "error"
possibly-unresolved-reference = "error"

# --- pytest / coverage ------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = [
  "error",
  # pytest-textual-snapshot 1.0 still calls datetime.utcnow() when writing its diff report.
  "ignore:datetime.datetime.utcnow:DeprecationWarning:pytest_textual_snapshot",
]

[tool.coverage.run]
branch = true
source = ["flakipype"]

[tool.coverage.report]
# Only ever raised, never lowered (see CLAUDE.md).
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]

# --- Architecture boundaries (import-linter) --------------------------------

[tool.importlinter]
root_package = "flakipype"

include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
containers = ["flakipype"]
layers = [
  "cli",
  "tui | unattended",
  "investigate",
  "fix",
  "actions",
  "agent | setup | scan",
  "llm | github | store",
  "flaky | config",
]
# Every subpackage must sit in a layer; __main__ only calls the CLI.
exhaustive = true
exhaustive_ignores = ["__main__"]

[[tool.importlinter.contracts]]
name = "flaky is pure: no network, files, processes, database, clock or settings"
type = "forbidden"
source_modules = ["flakipype.flaky"]
forbidden_modules = [
  "anthropic",
  "flakipype.config",
  "httpx2",
  "os",
  "pathlib",
  "socket",
  "sqlite3",
  "subprocess",
  "time",
]

[[tool.importlinter.contracts]]
name = "Only github and setup.daemon start processes"
type = "forbidden"
source_modules = ["flakipype"]
forbidden_modules = ["subprocess"]
ignore_imports = [
  "flakipype.github.* -> subprocess",
  "flakipype.setup.daemon -> subprocess",
]
# Others reach gh and systemctl through these modules, never subprocess themselves.
allow_indirect_imports = true

# --- Dead code and dependency hygiene ---------------------------------------

[tool.deptry]
known_first_party = ["flakipype"]

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 80

# --- Task runner (uv run poe <task>) ----------------------------------------

[tool.poe.tasks]
format = { cmd = "ruff format", help = "Format all files" }
format-check = { cmd = "ruff format --check", help = "Check formatting" }
lint = { cmd = "ruff check", help = "Lint (ruff, all rules)" }
typecheck = { cmd = "ty check", help = "Type check (ty)" }
arch = { cmd = "lint-imports", help = "Architecture boundaries (import-linter)" }
deps = { cmd = "deptry src", help = "Unused, missing and misplaced dependencies" }
deadcode = { cmd = "vulture", help = "Dead code" }
shellcheck = { cmd = "shellcheck install.sh tests/smoke/smoke.sh", help = "Lint the shell scripts (ShellCheck)" }
test = { cmd = "pytest", help = "Run the tests" }
test-cov = { cmd = "pytest --cov --cov-report=term-missing --cov-report=xml", help = "Tests with coverage thresholds" }
check = { sequence = [
  "format-check",
  "lint",
  "typecheck",
  "arch",
  "deps",
  "deadcode",
  "shellcheck",
  "test-cov",
], help = "All local quality gates (definition of done)" }
