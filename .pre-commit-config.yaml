# Locally: `prek install` (or `pre-commit install`). CI runs the same hooks with `prek run --all-files`.
# Hooks are pinned to commit SHAs; Dependabot (ecosystem pre-commit) updates them including the `# frozen:` comment.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: detect-private-key
      # Textual snapshots are generated SVG and must stay byte-identical to what the test produced.
      - id: end-of-file-fixer
        exclude: '/__snapshots__/'
      - id: trailing-whitespace
        exclude: '/__snapshots__/'
      - id: mixed-line-ending
        args: ['--fix=no']
        exclude: '/__snapshots__/'
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
    hooks:
      - id: zizmor
